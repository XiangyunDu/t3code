name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vp check

  test-packages:
    name: Tests (packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/**' test

  test-server:
    name: Tests (server ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/server/src/preview 的测试跑真实浏览器上下文，缺 chromium 会失败
      - run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
      # 两核机器上默认并发会互相拖死，和上游一致限到 4
      - run: pnpm --filter t3 test -- --shard ${{ matrix.shard }}/8 --concurrency 4

  test-web-unit:
    name: Tests (web unit ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 直接调 vp，绕开 apps/web 里写死的 --project browser
      - run: pnpm --filter @t3tools/web exec vp test run --project unit --shard ${{ matrix.shard }}/2
